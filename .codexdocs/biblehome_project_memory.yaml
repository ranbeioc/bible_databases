    decision: "不采用为主数据库"
    reason:
      - "关系能力不足"
      - "后续 annotation / 社区 / RAG 查询复杂"
  cloudflare_vectorize:
    decision: "不采用为主向量库"
    reason:
      - "不适合作为强关系、多表过滤、权限控制的核心向量层"
      - "当前 pgvector 更适合"
    possible_future_role:
      - "作为加速召回层"
  cloudflare_workers_ai:
    decision: "可用但不作为当前主 embedding 方案"
    reason:
      - "可用于验证或补充"
      - "不适合大规模长期全量向量化主流程"

rejected_or_not_adopted_options:
  - option: "Bible 主数据全部通过 REST API 查询"
    reason:
      - "破坏读多写少场景性能"
      - "失去 CDN 强缓存优势"
  - option: "主数据库使用 Cloudflare D1"
    reason:
      - "不适合复杂关系与扩展"
  - option: "主向量库使用 Cloudflare Vectorize"
    reason:
      - "不适合当前复杂过滤与关系协同"
  - option: "分两个数据库分别做 pgvector 与 PostGIS"
    reason:
      - "跨库复杂，维护成本高"
  - option: "VPS CPU 作为 embedding 主力"
    reason:
      - "速度不可接受"
  - option: "正式向量库混用 q8_0 与 f16 或不同 embedding 模型"
    reason:
      - "向量空间不一致，检索会失真"

